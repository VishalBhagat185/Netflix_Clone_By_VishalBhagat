<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix India - Watch Tv Shows Online , Watch Tv Shows Online</title>
    <link rel="stylesheet" href="NetflixClone.css" />
  </head>
  <body>
    <div class="main">
      <nav>
        <span><img width="53" src="Assets/imges/logo.svg" alt="" /></span>
        <div class="Right-Button">
          <button class="btn">English</button>
          <button class="btn btn-red-sm">Sign In</button>
        </div>
      </nav>

      <div class="box"></div>
      <div class="Hero">
        <span>Enjoy big movies, hit series and more from ₹ 149.</span>
        <span>Join today. Cancel anytime.</span>
        <span
          >Ready to watch? Enter email to create or restart your
          membership.</span
        >
        <div class="Hero-buttons">
          <input
            type="text"
            name=""
            id=""
            placeholder="          Email Address"
          />
          <button class="btn btn-red">Get Started &gt;</button>
        </div>
      </div>

      <div class="Seperation"></div>
    </div>
    <section class="first">
      <div>
        <span>Enjoy on your TV </span>
        <span
          >Watch on smart TVs, PlayStation, Xbox, Chromecast, Apple TV, Blu-ray
          players and more.</span
        >
      </div>

      <div class="secImg">
        <img
          src="https://assets.nflxext.com/ffe/siteui/acquisition/ourStory/fuji/desktop/tv.png"
          alt=""
        />
        <video
          src="https://assets.nflxext.com/ffe/siteui/acquisition/ourStory/fuji/desktop/video-tv-in-0819.m4v"
          autoplay
          loop
          muted
        ></video>
      </div>
    </section>
  </body>
</html>
